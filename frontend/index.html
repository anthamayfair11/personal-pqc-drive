<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal PQC Drive - Phase 2 / crypto.ts 動作確認</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --border: #2a313d;
      --text: #e6e9ef;
      --muted: #8a92a3;
      --accent: #6ea8ff;
      --ok: #5fd38a;
      --err: #ff6b6b;
      --code: #1b2029;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    button {
      background: var(--accent); color: #0a0e15; border: 0;
      border-radius: 4px; padding: 8px 14px; font-weight: 600;
      cursor: pointer; font-size: 13px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      margin-top: 16px;
      background: var(--code); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-all;
      max-height: 75vh; overflow-y: auto;
    }
    .log-info  { color: var(--text); }
    .log-muted { color: var(--muted); padding-left: 18px; }
    .log-step  { color: var(--accent); font-weight: 600; margin-top: 10px; }
    .log-ok    { color: var(--ok); font-weight: 600; padding-left: 18px; }
    .log-err   { color: var(--err); font-weight: 600; padding-left: 18px; }
  </style>
</head>
<body>
  <h1>Phase 2: crypto.ts 動作確認 (Vite 経由)</h1>
  <div class="subtitle">
    フェーズ1で検証した暗号ロジックを <code>src/crypto.ts</code> に切り出した版で、
    バンドラ(Vite)経由でも同じ往復・改ざん検出・不正鍵検出が動くことを確認する。
  </div>
  <button id="run-btn">テストを再実行</button>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
